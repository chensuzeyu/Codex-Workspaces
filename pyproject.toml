[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workspaces"
version = "0.2.0"
description = "Per-account Codex environments, background proxies and SSH entry points on a shared Linux host"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
codex-workspace = "codex_workspaces.cli:main"
cws = "codex_workspaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_workspaces = ["templates/*"]
